<!doctype html>
<html lang="vi-VN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Script khoi tao giao dien: thiet lap che do toi html.dark truoc khi render de tranh giat man hinh
      (function () {
        try {
          if (localStorage.getItem('tf-theme') !== 'light') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=double-quote" />
    <meta name="theme-color" content="#8B5CF6" />
    <title>Tick Stock Panel · Quant Terminal (Thị trường Chứng khoán Việt Nam)</title>
    <script type="module" crossorigin src="./assets/index-B6cxAsj0.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Df5IeE5j.css">
  </head>
  <body class="bg-base text-foreground">
    <div id="root"></div>
    <script>
      // Script can chinh ty le zoom giao dien #root
      (function () {
        var z = 1
        try {
          var raw = localStorage.getItem('tf-page-zoom')
          var v = raw == null ? 1 : JSON.parse(raw)
          if (typeof v === 'number' && v >= 0.8 && v <= 1.5) z = v
        } catch (e) {}
        if (z !== 1) {
          var root = document.getElementById('root')
          root.style.transformOrigin = '0 0'
          root.style.transform = 'scale(' + z + ')'
          root.style.width = (100 / z) + '%'
          root.style.height = (100 / z) + '%'
        }
      })()
    </script>
  </body>
</html>
