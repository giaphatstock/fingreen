    <!-- Critical Above-the-Fold Inline CSS (Navbar, Background & Hero Title) -->
    <style>
      :root{--color-primary:#5154F0;--bg-main:#0a0b16;--bg-card:#121426;--bg-card-hover:#181b32;--bg-input:#1a1e38;--bg-subtle:#14172e;--border-color:#24294d;--text-main:#f3f4f6;--text-muted:#9ca3af;--nav-bg:rgba(10,11,22,0.92)}
      html.theme-dark{:root{--bg-main:#000000;--bg-card:#0d0e12;--bg-subtle:#111318;--border-color:#222530;--text-main:#ffffff;--text-muted:#9aa0a6;--nav-bg:rgba(0,0,0,0.94)}}
      html.theme-light{:root{--bg-main:#F3ECFB;--bg-card:#ffffff;--bg-subtle:#ebdff7;--border-color:#dfceef;--text-main:#1d182b;--text-muted:#6a627a;--nav-bg:rgba(243,236,251,0.94)}}
      *,::before,::after{box-sizing:border-box}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:Inter,system-ui,-apple-system,sans-serif}
      body{margin:0;background-color:var(--bg-main);color:var(--text-main);min-height:100vh}
      nav{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(16px);border-bottom:1px solid var(--border-color);background-color:var(--nav-bg)}
      .text-gradient{background:linear-gradient(135deg,#5154F0 0%,#A8AAF8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
      .bg-mesh{background-color:var(--bg-main);background-image:radial-gradient(at 0% 0%,rgba(81,84,240,0.12) 0,transparent 50%),radial-gradient(at 100% 100%,rgba(168,170,248,0.08) 0,transparent 50%)}
      .card{background-color:var(--bg-card);border:1px solid var(--border-color);border-radius:1rem;padding:1.5rem}
      .input-field{background-color:var(--bg-input);border:1px solid var(--border-color);border-radius:0.75rem;padding:0.75rem 1rem;color:var(--text-main);width:100%}
    </style>
